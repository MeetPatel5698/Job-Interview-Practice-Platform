<!DOCTYPE html>
<html>
<head>
    <title>Interview History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="page-panel history-panel">

    <div class="page-header">
        <div>
            <p class="eyebrow">PrepBot</p>
            <h1>Interview History</h1>
        </div>

        <a href="/dashboard" class="text-button">Dashboard</a>
    </div>

    {% for interview in interviews %}

        <div class="history-item">
            <h3>{{ interview.role }}</h3>

            <p><strong>Question:</strong> {{ interview.question }}</p>

            <p><strong>Answer:</strong> {{ interview.answer }}</p>

            <p><strong>Feedback:</strong> {{ interview.feedback }}</p>

            <p><strong>Score:</strong> {{ interview.score }}/10</p>
        </div>

    {% else %}

        <p class="muted-text">No interview answers saved yet.</p>

    {% endfor %}

</div>

</body>
</html>
